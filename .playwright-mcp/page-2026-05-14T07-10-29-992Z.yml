            - heading "惹怒核心玩家！国游团队突发舆论风波 删帖致歉仍难平息" [level=1] [ref=e285]
            - generic [ref=e286]: 2026-04-09 15:21:58 来源：游民星空 作者：猛鲨男鱼王 编辑：猛鲨男鱼王 浏览：8641
          - generic [ref=e287]:
            - paragraph [ref=e288]: 2026年4月9日消息，国产Galgame独立游戏工作室异美（前红茶Games，代表作《海沙风云》《梦灯花》）突发舆论危机。
            - paragraph [ref=e289]: 4月8日晚，其B站官方账号转发争议性内容。该工作室核心受众以男性玩家为主，相关操作被认为严重触及玩家情感底线。
            - paragraph [ref=e290]:
              - link "游民星空" [ref=e291] [cursor=pointer]:
                - /url: https://www.gamersky.com/showimage/id_gamersky.shtml?https://img1.gamersky.com/upimg/pic/2026/04/09/origin_202604091511476764.png
                - img "游民星空" [ref=e292]
            - paragraph
            - paragraph [ref=e293]: 事发后工作室紧急删帖并致歉，称系运营人员个人失误、账号管理疏漏，对涉事员工处以扣薪、调整年终评级。但处罚过轻、回应敷衍未能平息怒火，大量玩家涌入官方评论区抵制。
            - paragraph [ref=e294]:
              - link "游民星空" [ref=e295] [cursor=pointer]:
                - /url: https://www.gamersky.com/showimage/id_gamersky.shtml?https://img1.gamersky.com/upimg/pic/2026/04/09/origin_202604091512133568.png
                - img "游民星空" [ref=e296]
            - paragraph
            - paragraph [ref=e297]: 该工作室曾以《海沙风云》创下Steam 98%好评（现已回落至97%）的国产AVG标杆成绩。此次运营事故 + 公关失当，导致其多年积累口碑一夜崩盘，遭玩家大规模抵制。
