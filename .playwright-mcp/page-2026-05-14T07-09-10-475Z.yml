                  - img "视频" [ref=e453]
                  - link "《海沙风云》预告片" [ref=e454] [cursor=pointer]:
                    - /url: https://www.youtube.com/watch?v=6pcFPEbVfr0
          - paragraph [ref=e455]:
            - text: 2020年2月19日，异美工作室在
            - link "众筹" [ref=e456] [cursor=pointer]:
              - /url: /wiki/%E7%9C%BE%E7%B1%8C
            - text: 网站
            - link "摩点" [ref=e457] [cursor=pointer]:
              - /url: /wiki/%E6%91%A9%E7%82%B9%E6%96%87%E5%A8%B1
            - text: 发布《海沙风云》企画的相关细节，包括一些概念图和角色简介
            - superscript [ref=e458]:
              - link "[13]" [ref=e459] [cursor=pointer]:
                - /url: "#cite_note-modian01-14"
            - text: 。异美工作室原打算以众筹获得更多资金支持，不过在发布三个月后，
            - link "心动" [ref=e460] [cursor=pointer]:
              - /url: /wiki/%E5%BF%83%E5%8A%A8%E5%85%AC%E5%8F%B8
            - text: 就主动向异美工作室提出合作。心动在发行和宣发方面给与制作团队很多帮助，让没有发行经验的他们少走了弯路。当时异美工作室还没制作出游戏
            - link "Demo" [ref=e461] [cursor=pointer]:
              - /url: /wiki/%E6%B8%B8%E6%88%8F%E6%BC%94%E7%A4%BA
            - text: ，是制作团队的成员HJL_Misaki和核燃黑猫过去在二次元领域有过不错的作品，让心动对还未成型的《海沙风云》拥有信心，所以决定获取作品的发行权
            - superscript [ref=e462]:
              - link "[10]" [ref=e463] [cursor=pointer]:
                - /url: "#cite_note-youxiputao01-11"
            - text: 。此外心动还给予了资金的支持，让本来就超过预期三倍开发成本的异美工作室缓解了开发压力，在摩点的众筹计划也随之取消
            - superscript [ref=e464]:
              - link "[10]" [ref=e465] [cursor=pointer]:
                - /url: "#cite_note-youxiputao01-11"
            - superscript [ref=e466]:
              - link "[13]" [ref=e467] [cursor=pointer]:
                - /url: "#cite_note-modian01-14"
            - text: 。10月14日，心动网络在
            - link "Bilibili" [ref=e468] [cursor=pointer]:
              - /url: /wiki/Bilibili
            - text: 和
            - link "YouTube" [ref=e469] [cursor=pointer]:
              - /url: /wiki/YouTube
            - text: 发布了《海沙风云》的宣传PV。同时制作组进驻
            - link "TapTap" [ref=e470] [cursor=pointer]:
              - /url: /wiki/TapTap
            - text: ，游戏亦在TapTap展开预约
            - superscript [ref=e471]:
              - link "[8]" [ref=e472] [cursor=pointer]:
                - /url: "#cite_note-vgtime01-9"
            - text: 。此后制作组在TapTap不定期公布游戏的世界观等细节
            - superscript [ref=e473]:
              - link "[18]" [ref=e474] [cursor=pointer]:
                - /url: "#cite_note-taptap01-19"
            - text: 。2020年11月14到15日期间参加上海
            - link "WePlay文化展" [ref=e475] [cursor=pointer]:
              - /url: /w/index.php?title=WePlay%E6%96%87%E5%8C%96%E5%B1%95&action=edit&redlink=1
            - text: ，在TapTap的展台上首次展出游戏的Demo
            - superscript [ref=e476]:
              - link "[19]" [ref=e477] [cursor=pointer]:
                - /url: "#cite_note-weibo02-20"
            - text: 。
          - paragraph [ref=e478]:
            - text: 2021年7月22日，心动申请《海沙风云》的移动、客户端获得
            - link "国家新闻出版署" [ref=e479] [cursor=pointer]:
              - /url: /wiki/%E5%9C%8B%E5%AE%B6%E6%96%B0%E8%81%9E%E5%87%BA%E7%89%88%E7%BD%B2
            - text: 批出的游戏版号，游戏正式满足在中国大陆发行的要求
            - superscript [ref=e480]:
              - link "[20]" [ref=e481] [cursor=pointer]:
                - /url: "#cite_note-sina01-21"
            - text: 。同年8月18日，游戏在
            - link "Steam" [ref=e482] [cursor=pointer]:
              - /url: /wiki/Steam
            - text: 正式发售
            - superscript [ref=e483]:
              - link "[21]" [ref=e484] [cursor=pointer]:
                - /url: "#cite_note-gamersky02-22"
            - text: ，发售首周有折扣优惠
            - superscript [ref=e485]:
              - link "[17]" [ref=e486] [cursor=pointer]:
                - /url: "#cite_note-ali2130-1-18"
            - text: 。9月，异美工作室与
            - link "热脉游戏" [ref=e487] [cursor=pointer]:
              - /url: /wiki/%E7%83%AD%E8%84%89%E6%B8%B8%E6%88%8F
            - text: 就《海沙风云》后续发行工作达成合作，发行商更换为热脉游戏。双方约定2022年9月在Steam推出英语和日语版本，并在
            - link "Kickstarter" [ref=e488] [cursor=pointer]:
              - /url: /wiki/Kickstarter
            - text: 和摩点开展众筹，但众筹过程中双方沟通并不顺利，外语版也未按时发售。此后双方在
            - link "游戏机" [ref=e489] [cursor=pointer]:
              - /url: /wiki/%E5%AE%B6%E7%94%A8%E9%81%8A%E6%88%B2%E6%A9%9F
            - text: 版本的
            - link "用户界面" [ref=e490] [cursor=pointer]:
              - /url: /wiki/%E7%94%A8%E6%88%B7%E7%95%8C%E9%9D%A2
            - text: 优化和移植工作上发生分歧，2023年4月，异美工作室宣布与热脉游戏解约，并拒绝热脉游戏的解约赔偿要求，表示将向热脉游戏提起诉讼
            - superscript [ref=e491]:
              - link "[22]" [ref=e492] [cursor=pointer]:
                - /url: "#cite_note-youxiputao02-23"
            - text: 。2024年5月，经过第三轮审理，法庭支持异美工作室的诉求，热脉游戏将游戏Steam商店权限给付给异美工作室
            - superscript [ref=e493]:
              - link "[23]" [ref=e494] [cursor=pointer]:
                - /url: "#cite_note-chuapp02-24"
            - text: 。
          - generic [ref=e495]:
            - heading "评价" [level=2] [ref=e496]: 评价
            - generic [ref=e497]:
              - text: "["
              - link "编辑" [ref=e498] [cursor=pointer]:
                - /url: /w/index.php?title=%E6%B5%B7%E6%B2%99%E9%A2%A8%E9%9B%B2&action=edit&section=6
              - text: "]"
          - complementary [ref=e499]:
            - generic [ref=e500]: 评价
            - table "评论得分" [ref=e501]:
              - caption [ref=e502]: 评论得分
              - rowgroup [ref=e503]:
                - row "媒体 得分" [ref=e504]:
                  - columnheader "媒体" [ref=e505]
                  - columnheader "得分" [ref=e506]
