                    - superscript [ref=e517]:
                      - link "[4]" [ref=e518] [cursor=pointer]:
                        - /url: "#cite_note-tgbus01-5"
          - figure "游戏的枪战场景CG，左侧为女主角柯罗莎·诺奈特" [ref=e519]:
            - link [ref=e520] [cursor=pointer]:
              - /url: /wiki/File:Far_Away_gunshot_scene.jpg
              - img [ref=e521]
            - generic [ref=e522]: 游戏的枪战场景CG，左侧为女主角柯罗莎·诺奈特
          - paragraph [ref=e523]:
            - text: 游戏发售首周销量达到一万七千份
            - superscript [ref=e524]:
              - link "[25]" [ref=e525] [cursor=pointer]:
                - /url: "#cite_note-weibo01-26"
            - text: ，游戏在Steam上的玩家总体评价为“特别好评”
            - superscript [ref=e526]:
              - link "[5]" [ref=e527] [cursor=pointer]:
                - /url: "#cite_note-udn01-6"
            - text: 。在2021中文恋爱游戏大赛中入围“最佳剧本”、“最佳美术”、“最佳演出”、“最佳恋爱游戏”和“最佳新组”
            - superscript [ref=e528]:
              - link "[26]" [ref=e529] [cursor=pointer]:
                - /url: "#cite_note-3dmgame02-27"
            - text: 。2022年获得该年的indiePlay中国独立游戏大赛的“最佳听觉效果”
            - superscript [ref=e530]:
              - link "[27]" [ref=e531] [cursor=pointer]:
                - /url: "#cite_note-youxiputao03-28"
            - text: 。
          - paragraph [ref=e532]:
            - text: 《海沙风云》是中国大陆少见的全程粤语配音的冒险游戏
            - superscript [ref=e533]:
              - link "[17]" [ref=e534] [cursor=pointer]:
                - /url: "#cite_note-ali2130-1-18"
            - text: ，中文媒体普遍认为粤语配音带来别样的新鲜感，同时也指出了一些问题
            - superscript [ref=e535]:
              - link "[5]" [ref=e536] [cursor=pointer]:
                - /url: "#cite_note-udn01-6"
            - superscript [ref=e537]:
              - link "[7]" [ref=e538] [cursor=pointer]:
                - /url: "#cite_note-gamersky01-8"
            - superscript [ref=e539]:
              - link "[24]" [ref=e540] [cursor=pointer]:
                - /url: "#cite_note-3dmgame01-25"
            - superscript [ref=e541]:
              - link "[28]" [ref=e542] [cursor=pointer]:
                - /url: "#cite_note-chuapp01-29"
            - text: 。
            - link "触乐" [ref=e543] [cursor=pointer]:
              - /url: /wiki/%E8%A7%A6%E4%B9%90
            - text: 编辑冯昕旸表示游戏使用粤配结合游戏的警匪探案剧情，让人找回过去看香港
            - link "警匪片" [ref=e544] [cursor=pointer]:
              - /url: /wiki/%E8%AD%A6%E5%8C%AA%E7%89%87
            - text: 的感觉
            - superscript [ref=e545]:
              - link "[28]" [ref=e546] [cursor=pointer]:
                - /url: "#cite_note-chuapp01-29"
            - text: 。评论员RAY在udn游戏角落摘文评论游戏选择粤语配音是一个双刃剑，对听的懂得玩家会有加分效果，而对于其他玩家来说粤配是有趣，但有说不出的冲突感。此外他也建议游戏考虑为
            - link "香港" [ref=e547] [cursor=pointer]:
              - /url: /wiki/%E9%A6%99%E6%B8%AF
            - text: 玩家推出
            - link "繁体中文" [ref=e548] [cursor=pointer]:
              - /url: /wiki/%E7%B9%81%E9%AB%94%E4%B8%AD%E6%96%87
            - superscript [ref=e549]:
              - link "[5]" [ref=e550] [cursor=pointer]:
                - /url: "#cite_note-udn01-6"
            - text: 。
            - link "3DM" [ref=e551] [cursor=pointer]:
              - /url: /wiki/3DM
            - text: 的编辑Marvin也提到游戏的粤语配音“呈现出极高的配音水准和语言的使用能力”，只是由于文本和配音剧本存在差异，会对玩家的理解造成障碍
            - superscript [ref=e552]:
              - link "[24]" [ref=e553] [cursor=pointer]:
                - /url: "#cite_note-3dmgame01-25"
            - text: 。
          - paragraph [ref=e554]:
            - text: 游戏美术和角色设计获得正面的评价，RAY称赞该作美术出色
            - superscript [ref=e555]:
              - link "[5]" [ref=e556] [cursor=pointer]:
                - /url: "#cite_note-udn01-6"
            - text: 。冯昕旸也认为游戏的美术设计达到优秀的水准，“角色线条都很有张力，充分体现各个角色的个性”，特别是女主角的表情尤为生动；游戏的演出效果在文字游戏中也难得，在动作场景时，通DM过改变角色立绘大小和位置，巧妙表现出角色之间的相对位置关系和动作
            - superscript [ref=e557]:
              - link "[28]" [ref=e558] [cursor=pointer]:
                - /url: "#cite_note-chuapp01-29"
            - text: 。
          - paragraph [ref=e559]:
            - text: 游戏剧情设计方面评价各异，
            - link "电玩巴士" [ref=e560] [cursor=pointer]:
              - /url: /wiki/%E7%94%B5%E7%8E%A9%E5%B7%B4%E5%A3%AB
            - text: 评论员WhiteFox的评价是中规中矩，没有特别吸引人的点，游戏用了很多黑色幽默，但是大部分笑点一般人都无法理解得到，对话内容有偏向
            - link "动画" [ref=e561] [cursor=pointer]:
              - /url: /wiki/%E5%8B%95%E7%95%AB
            - text: 的
            - link "既视感" [ref=e562] [cursor=pointer]:
              - /url: /wiki/%E6%97%A2%E8%A6%96%E6%84%9F
            - text: ，像在对台词，不容易让玩家代入。多结局设计时是其亮点，延长了玩家游戏时长，让玩家体验不同的人生感受，还有收集的乐趣，了解到不同游戏角色的关系和故事背景，坏处就是要不断重复一样的剧情
            - superscript [ref=e563]:
              - link "[4]" [ref=e564] [cursor=pointer]:
                - /url: "#cite_note-tgbus01-5"
            - text: 。Marvin则给与剧情很高的评价，制作团队“非常富有野心”地设计了很宏大复杂的世界观，剧情质量很出色
            - superscript [ref=e565]:
              - link "[24]" [ref=e566] [cursor=pointer]:
                - /url: "#cite_note-3dmgame01-25"
            - text: 。
          - paragraph [ref=e567]:
            - text: Marvin还指出游戏在
            - link "交互设计" [ref=e568] [cursor=pointer]:
              - /url: /wiki/%E4%BA%92%E5%8B%95%E8%A8%AD%E8%A8%88
            - text: 方面的不足，游戏的工具栏默认隐藏在右侧，不方便玩家发现。游戏有多条剧情分支，并附有流程图，不过无法使用流程图跳转到对应分歧的节点，对于想体验全剧情和开启隐藏小剧场的玩家造成不便。角色线条都很有张力，充分体现各个角色的个性
            - superscript [ref=e569]:
              - link "[24]" [ref=e570] [cursor=pointer]:
                - /url: "#cite_note-3dmgame01-25"
            - text: 。
