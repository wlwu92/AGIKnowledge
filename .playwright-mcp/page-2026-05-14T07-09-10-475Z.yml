                - rowheader "发行日" [ref=e268]
                - cell "2021年8月18日" [ref=e269]
          - paragraph [ref=e270]:
            - text: 《海沙风云》是中国异美工作室（旧名红茶Games
            - superscript [ref=e271]:
              - link "[注 1]" [ref=e272] [cursor=pointer]:
                - /url: "#cite_note-2"
            - text: ）制作的一款
            - link "文字冒险游戏" [ref=e273] [cursor=pointer]:
              - /url: /wiki/%E6%96%87%E5%AD%97%E5%86%92%E9%9A%AA%E9%81%8A%E6%88%B2
            - text: ，游戏于2021年8月18日在
            - link "Steam" [ref=e274] [cursor=pointer]:
              - /url: /wiki/Steam
            - text: 发行
            - superscript [ref=e275]:
              - link "[2]" [ref=e276] [cursor=pointer]:
                - /url: "#cite_note-Steam01-3"
            - text: 。本作是异美工作室的第一款作品，未来预计会登陆
            - link "iOS" [ref=e277] [cursor=pointer]:
              - /url: /wiki/IOS
            - text: 和
            - link "安卓" [ref=e278] [cursor=pointer]:
              - /url: /wiki/%E5%AE%89%E5%8D%93
            - text: 平台。
          - generic [ref=e279]:
            - heading "游戏系统" [level=2] [ref=e280]: 游戏系统
            - generic [ref=e281]:
              - text: "["
              - link "编辑" [ref=e282] [cursor=pointer]:
                - /url: /w/index.php?title=%E6%B5%B7%E6%B2%99%E9%A2%A8%E9%9B%B2&action=edit&section=1
              - text: "]"
          - figure "游戏的百科系统" [ref=e283]:
            - link [ref=e284] [cursor=pointer]:
              - /url: /wiki/File:Far_Away_encyclopedia_system.png
              - img [ref=e285]
            - generic [ref=e286]: 游戏的百科系统
          - paragraph [ref=e287]:
            - text: 《海沙风云》采取
            - link "文字冒险" [ref=e288] [cursor=pointer]:
              - /url: /wiki/%E6%96%87%E5%AD%97%E5%86%92%E9%99%A9
            - text: 的游玩方式，
            - link "玩家" [ref=e289] [cursor=pointer]:
              - /url: /wiki/%E7%8E%A9%E5%AE%B6
            - text: 所扮演的是本作的女主角柯罗莎·诺奈特，大部分的剧情玩家会以柯罗莎·诺奈特的视角进行游戏，部分剧情会切换为其他角色的视角，玩家能看到所处视角下，角色的内心
            - link "独白" [ref=e290] [cursor=pointer]:
              - /url: /wiki/%E7%8B%AC%E7%99%BD
            - text: 。玩家游玩时，需要阅览屏幕上所显示的文本以了解故事情节和人物之间的
            - link "对话" [ref=e291] [cursor=pointer]:
              - /url: /wiki/%E5%B0%8D%E8%A9%B1
            - text: 。这些文字会与人物的立绘和背景一同出现，用于表示对话的对象。对话对象的立绘会随着对话进行而变化，根据对话的内容做出不同动作或表情，如脸红，惊愕，皱眉等。其中女主角在不同剧情支线中担任各类职业，其立绘的服饰也随之改变。在部分场景中会遇见代替背景和人物立绘的
            - link "电脑图像" [ref=e292] [cursor=pointer]:
              - /url: /wiki/%E9%9B%BB%E8%85%A6%E5%9C%96%E5%83%8F
            - text: 。游戏中会在默认的段落中出现行为选项供玩家选择，对话框的下一段文本在做出选择前并不能够显示。游戏中除了序章玩家视角的某个角色外，其余角色对白皆有
            - link "粤语" [ref=e293] [cursor=pointer]:
              - /url: /wiki/%E7%B2%B5%E8%AA%9E
            - text: 语音。粤语语音和游戏文本内容存在差异，不完全重合
            - superscript [ref=e294]:
              - link "[3]" [ref=e295] [cursor=pointer]:
                - /url: "#cite_note-game-4"
            - text: 。
          - paragraph [ref=e296]:
            - text: 游戏中有九个主线剧情，十六个分支剧情，每个结局都有所不同，女主角进入哪一个主线基于玩家在游玩过程中作出的选择
            - superscript [ref=e297]:
              - link "[3]" [ref=e298] [cursor=pointer]:
                - /url: "#cite_note-game-4"
            - text: 。游戏内置有流程图方便玩家攻略不同的支线。游戏的关键选择，可以根据之前对话轻松推测，而且制作组有将部分关键信息特别红色标注，方便玩家推理
            - superscript [ref=e299]:
              - link "[4]" [ref=e300] [cursor=pointer]:
                - /url: "#cite_note-tgbus01-5"
            - text: 。游戏中亦设有人物关系图和百科，玩家每次遇到新角色和新的概念与典故，人物关系图和百科都会更新资料，帮助玩家了解故事的世界观
            - superscript [ref=e301]:
              - link "[3]" [ref=e302] [cursor=pointer]:
                - /url: "#cite_note-game-4"
            - text: 。游戏中同时存在不少女主角死亡的坏结局，触发坏结局可以解锁在鉴赏模式的小剧场，小剧场是关于一些主要主角在主线外发生的故事
            - superscript [ref=e303]:
              - link "[5]" [ref=e304] [cursor=pointer]:
                - /url: "#cite_note-udn01-6"
            - text: 。
          - generic [ref=e305]:
            - heading "故事简介" [level=2] [ref=e306]: 故事简介
            - generic [ref=e307]:
              - text: "["
              - link "编辑" [ref=e308] [cursor=pointer]:
                - /url: /w/index.php?title=%E6%B5%B7%E6%B2%99%E9%A2%A8%E9%9B%B2&action=edit&section=2
              - text: "]"
          - paragraph [ref=e309]:
            - text: 位于科尔赛斯大陆西南角的贝让港，面朝大海，背靠坎特里卡大沙漠，是数条航线的重要节点。贝让被誉为“海与沙之都”，为
            - link "永久中立国" [ref=e310] [cursor=pointer]:
              - /url: /wiki/%E6%B0%B8%E4%B9%85%E4%B8%AD%E7%AB%8B%E5%9C%8B
            - text: 不设有
            - link "军队" [ref=e311] [cursor=pointer]:
              - /url: /wiki/%E8%BB%8D%E9%9A%8A
            - text: ，仅以
            - link "警察" [ref=e312] [cursor=pointer]:
              - /url: /wiki/%E8%AD%A6%E5%AF%9F
            - text: 维持城市治安，在三十年前的经历过一场席卷整座城市的“海盗战争”。战后，战时市民组成的自卫团改组为帮派“卡勒瓦”，政府重建市政厅。战争大幅削弱了政府的管治能力，新成立的卡勒瓦更威胁到市政厅的威信，两者明争暗斗了二十多年。九年前警察对卡勒瓦发起大围剿，警队逮捕了卡勒瓦首领同时也遭到重创，卡勒瓦群龙无首下分裂成大量帮派，其中最大的两派为恩佐派和沃尔夫派，围剿行动之后贝让的治安反而越发糟糕
            - superscript [ref=e313]:
              - link "[3]" [ref=e314] [cursor=pointer]:
                - /url: "#cite_note-game-4"
            - text: 。
          - paragraph [ref=e315]:
            - text: 再渡过九年相对平静的时光，一个新的阴谋在贝让酝酿。柯罗莎·诺奈特是贝让港码头的一个搬运工，生活平淡又简单。某天遇上警察在码头的缉捕行动，让柯罗莎接触到不一样的世界并萌生出改变现有生活的念头。随着玩家的选择，柯罗莎开始离开码头，或选择去新城区做服务员，或选择成为警察，或选择加入黑帮等等
            - superscript [ref=e316]:
              - link "[6]" [ref=e317] [cursor=pointer]:
                - /url: "#cite_note-gamer01-7"
            - text: 。在商队路线中，柯罗莎会加入阿瓦的商队横跨沙漠。在警察、侦探、黑帮和间谍路线，柯罗莎会以不同身份慢慢了解到恩佐派颠覆贝让政府的阴谋，并得知有不明的境外势力渗透贝让，在这些路线中柯罗莎可以选择支持恩佐派的政变融入新秩序，反之会在事后以不同原因离开贝让。在真结局砂之女线中，加入沃尔夫派的柯罗莎在决战中逃到了沙漠，加入了阿瓦的商队离开贝让。四年后，柯罗莎回到了变成大国战争前线的贝让，在崔希丝的邀请下展开新的旅途
            - superscript [ref=e318]:
              - link "[3]" [ref=e319] [cursor=pointer]:
                - /url: "#cite_note-game-4"
            - text: 。
          - generic [ref=e320]:
            - heading "登场角色" [level=2] [ref=e321]: 登场角色
            - generic [ref=e322]:
              - text: "["
              - link "编辑" [ref=e323] [cursor=pointer]:
                - /url: /w/index.php?title=%E6%B5%B7%E6%B2%99%E9%A2%A8%E9%9B%B2&action=edit&section=3
              - text: "]"
          - generic [ref=e324]:
            - term [ref=e325]:
              - text: 柯罗莎·诺奈特（英语：Krosa Noent
              - superscript [ref=e326]:
                - link "[2]" [ref=e327] [cursor=pointer]:
                  - /url: "#cite_note-Steam01-3"
              - text: ，声：尾狐殿）
            - definition [ref=e328]:
              - text: 故事
              - link "主人公" [ref=e329] [cursor=pointer]:
                - /url: /wiki/%E4%B8%BB%E4%BA%BA%E5%85%AC
              - text: ，
              - link "红发" [ref=e330] [cursor=pointer]:
                - /url: /wiki/%E7%B4%85%E9%AB%AE
              - text: 少女，是贝让的旧码头搬运工。自幼丧父，承继父业在旧码头工作。柯罗莎平日由父亲的好友布莱恩帮忙看照，为人富有正义感且乐于助人。在某次码头骚动后萌生改变现有生活的念头。
            - term [ref=e331]:
              - text: 阿瓦·纳尔巴（英语：Ava Narba
              - superscript [ref=e332]:
                - link "[2]" [ref=e333] [cursor=pointer]:
                  - /url: "#cite_note-Steam01-3"
              - text: ，声：傻莓酱）
            - definition [ref=e334]: 大沙漠商人民族纳尔巴人的后裔，向往先祖的经历，想组建商队冒险的金发少女。通晓各类杂学，富有冒险精神，在不同城市中寻找机遇。在某些路线中途径贝让结识柯罗莎，并邀请其加入商队。
            - term [ref=e335]:
              - text: 恩佐·肯特（英语：Enzo Kent
              - superscript [ref=e336]:
                - link "[2]" [ref=e337] [cursor=pointer]:
                  - /url: "#cite_note-Steam01-3"
              - text: ，声：紫丞少）
            - definition [ref=e338]: 贝让黑帮“卡勒瓦”的现任会长，和其他派系敌对。平日打扮温文尔雅，做事果断狠辣。故事中策划统一贝让地下世界。
            - term [ref=e339]:
              - text: 莉卡·沃尔夫（英语：Lica Wolf
              - superscript [ref=e340]:
                - link "[2]" [ref=e341] [cursor=pointer]:
                  - /url: "#cite_note-Steam01-3"
              - text: ，声：师欣）
            - definition [ref=e342]: 贝让黑帮“沃尔夫”的小头目，出身自遥远的东方。战力超群，被其他帮派称为“妖女”。为人爽朗，喜欢路见不平，在某些路线中帮助了柯罗莎解决麻烦。
            - term [ref=e343]:
              - text: 德里克·盖恩（英语：Dirk Gein
              - superscript [ref=e344]:
                - link "[2]" [ref=e345] [cursor=pointer]:
                  - /url: "#cite_note-Steam01-3"
              - text: ，声：Kenz）
            - definition [ref=e346]:
              - text: 从属卡勒瓦的冷血
              - link "杀手" [ref=e347] [cursor=pointer]:
                - /url: /wiki/%E6%AE%BA%E6%89%8B
              - text: ，沉迷杀戮的快感，热衷参与暗杀等工作。
            - term [ref=e348]:
              - text: 埃勒里·拉德（英语：Ellery Rath
              - superscript [ref=e349]:
                - link "[2]" [ref=e350] [cursor=pointer]:
                  - /url: "#cite_note-Steam01-3"
              - text: ，声：妖女）
            - definition [ref=e351]:
              - text: 贝让的私家侦探，出身于贝让邻国斯塔米诺。
              - link "退伍军人" [ref=e352] [cursor=pointer]:
                - /url: /wiki/%E9%80%80%E4%BC%8D%E8%BB%8D%E4%BA%BA
              - text: ，在战争中失去右腿而使用
              - link "义肢" [ref=e353] [cursor=pointer]:
                - /url: /wiki/%E7%BE%A9%E8%82%A2
              - text: 。和贝让警局的贝里克是故友，经常帮助警局查案。在某些路线中柯罗莎成为他的助手。
            - term [ref=e354]:
              - text: 米勒·杨（英语：Miller Yang
              - superscript [ref=e355]:
                - link "[2]" [ref=e356] [cursor=pointer]:
                  - /url: "#cite_note-Steam01-3"
              - text: ，声：阿戈依奥）
            - definition [ref=e357]:
              - text: 贝让警局的新晋警察，出身富商之家。充满正义感，不顾父亲反对入读警校，希望让贝让恢复正常。平日喜欢品尝各地美食。在某些路线中帮助柯罗莎成为
              - link "协警" [ref=e358] [cursor=pointer]:
                - /url: /wiki/%E5%8D%8F%E8%AD%A6
              - text: 。
            - term [ref=e359]:
              - text: 泰特·伊文斯（英语：Tate Evans
              - superscript [ref=e360]:
                - link "[2]" [ref=e361] [cursor=pointer]:
                  - /url: "#cite_note-Steam01-3"
              - text: ，声：Geass）
            - definition [ref=e362]: 贝让知名的新晋自由记者，拥有敏锐的新闻嗅觉。为了获得大新闻经常不择手段。在某些路线中柯罗莎成为其助手。
            - term [ref=e363]:
              - text: 崔希丝·哈丽（英语：Tracys
              - superscript [ref=e364]:
                - link "[2]" [ref=e365] [cursor=pointer]:
                  - /url: "#cite_note-Steam01-3"
              - text: ，声：岚风蜂蜜绿茶）
            - definition [ref=e366]: 柯罗莎在码头骚动中遇到的女子，自称“淑女”。做事随性，实则心思细密。
          - generic [ref=e367]:
            - heading "开发" [level=2] [ref=e368]: 开发
            - generic [ref=e369]:
              - text: "["
              - link "编辑" [ref=e370] [cursor=pointer]:
                - /url: /w/index.php?title=%E6%B5%B7%E6%B2%99%E9%A2%A8%E9%9B%B2&action=edit&section=4
              - text: "]"
          - figure "游戏的莉卡初稿，已经抛弃的龙司人设[7]" [ref=e371]:
            - link [ref=e372] [cursor=pointer]:
              - /url: /wiki/File:Far_Away_character_draft.jpg
              - img [ref=e373]
            - generic [ref=e374]:
              - text: 游戏的莉卡初稿，已经抛弃的龙司人设
              - superscript [ref=e375]:
                - link "[7]" [ref=e376] [cursor=pointer]:
                  - /url: "#cite_note-gamersky01-8"
          - paragraph [ref=e377]:
            - text: 制作人HJL_Misaki过去是同人社团“二维镜像”的成员，同时是制作游戏宣传视频的公司“二维镜像”的创始人之一
            - superscript [ref=e378]:
              - link "[8]" [ref=e379] [cursor=pointer]:
                - /url: "#cite_note-vgtime01-9"
            - text: 。在“二维镜像”制作视频期间，HJL_Misaki希望在作品中结合优秀的故事和丰富的演出，但是受限于视频的表达形式，内容传达只能比较隐晦和概念。为了更好表达想法和情感，HJL_Misaki决定制作一款
            - link "冒险游戏" [ref=e380] [cursor=pointer]:
              - /url: /wiki/%E5%86%92%E9%9A%AA%E9%81%8A%E6%88%B2
            - superscript [ref=e381]:
              - link "[9]" [ref=e382] [cursor=pointer]:
                - /url: "#cite_note-yys01-10"
            - text: 。此前HJL_Misaki没有创作游戏的经验，选择创作冒险游戏是因为这种类型技术要求较低，他本人又擅长剧情演绎和视听表现，所以自信能驾驭好这类游戏。2019年5月HJL_Misaki开始创作游戏，三个月后他感觉“一个人创作实在太孤独、太操蛋了”，决定创立红茶Games（现名异美工作室）。HJL_Misaki利用自己的人脉和过去同人社团的关系组建了红茶Games，团队有十二人，只有他一人全职，其他人均为业余兼任
            - superscript [ref=e383]:
              - link "[10]" [ref=e384] [cursor=pointer]:
                - /url: "#cite_note-youxiputao01-11"
            - text: ，在业余时间在线和HJL_Misaki进行游戏的创作
            - superscript [ref=e385]:
              - link "[11]" [ref=e386] [cursor=pointer]:
                - /url: "#cite_note-gameres01-12"
            - text: 。团队中只有负责美术的Sam Ashton、负责程序的Misata和负责音乐的Zris三人过去有制作游戏的经验
            - superscript [ref=e387]:
              - link "[10]" [ref=e388] [cursor=pointer]:
                - /url: "#cite_note-youxiputao01-11"
            - text: 。作品的主美由
            - link "漫画家" [ref=e389] [cursor=pointer]:
              - /url: /wiki/%E6%BC%AB%E7%95%AB%E5%AE%B6
            - text: 核燃黑猫担当，核燃黑猫过去是HJL_Misaki在“二维镜像”的引路人，两人为好友，在HJL_Misaki邀请下加入了制作组，并引荐了Sam Ashton等人加入
            - superscript [ref=e390]:
              - link "[12]" [ref=e391] [cursor=pointer]:
                - /url: "#cite_note-gameres02-13"
            - text: 。最后游戏的核心创作团队在2019年9月建立了起来
            - superscript [ref=e392]:
              - link "[13]" [ref=e393] [cursor=pointer]:
                - /url: "#cite_note-modian01-14"
            - text: 。HJL_Misaki负责项目的制作方向，具体设计交由成员自由发挥，结果创作超出了HJL_Misaki认知的内容
            - superscript [ref=e394]:
              - link "[10]" [ref=e395] [cursor=pointer]:
                - /url: "#cite_note-youxiputao01-11"
            - text: 。《海沙风云》定位是“硬派王道向”
            - superscript [ref=e396]:
              - link "[9]" [ref=e397] [cursor=pointer]:
                - /url: "#cite_note-yys01-10"
            - text: ，一反国内冒险游戏以恋爱为主的潮流，打算设计出堪比香港警匪片的奇妙冒险
            - superscript [ref=e398]:
              - link "[14]" [ref=e399] [cursor=pointer]:
                - /url: "#cite_note-17173-01-15"
            - text: 。原来HJL_Misaki构思中《海沙风云》的所有角色都是男性，以对应作品的定位，在团队的强烈要求下，大部分角色，包括主角都改为女性
            - superscript [ref=e400]:
              - link "[10]" [ref=e401] [cursor=pointer]:
                - /url: "#cite_note-youxiputao01-11"
            - text: 。此外游戏中的角色蒂姆一开始并没有设计为主要角色，由于负责人物原画的Sam Ashton在设计角色时的良好发挥，剧本在看到原画后决定为蒂姆新增剧情。各类新的创意，让原来计划三十万字的文本，作品完成时文本量变成了五十多万字
            - superscript [ref=e402]:
              - link "[12]" [ref=e403] [cursor=pointer]:
                - /url: "#cite_note-gameres02-13"
            - text: 。游戏的UI设计负责人谣过去没有相关经验，根据HJL_Misaki提供的几个关键（体积感、新古典主义）进行创作，最后的成品别具特色，和其他冒险游戏有鲜明区别
            - superscript [ref=e404]:
              - link "[10]" [ref=e405] [cursor=pointer]:
                - /url: "#cite_note-youxiputao01-11"
            - text: 。
          - paragraph [ref=e406]:
            - text: 游戏剧本由云卷语文书、圈十、珈珞和日光负责，其中云卷语文书为主笔，除了商人线和记者线，其他线路都有参与，还包括小剧场的剧情编写
            - superscript [ref=e407]:
              - link "[15]" [ref=e408] [cursor=pointer]:
                - /url: "#cite_note-weibo04-16"
            - text: 。他们是中国国内
            - link "东方Project" [ref=e409] [cursor=pointer]:
              - /url: /wiki/%E6%9D%B1%E6%96%B9Project
            - text: 同人圈出名的同人作家
            - superscript [ref=e410]:
              - link "[7]" [ref=e411] [cursor=pointer]:
                - /url: "#cite_note-gamersky01-8"
            - text: 。故事的大纲由HJL_Misaki编写，他有参考电影编剧
            - link "布莱克·斯奈德" [ref=e414] [cursor=pointer]:
              - /url: /w/index.php?title=%E5%B8%83%E8%90%8A%E5%85%8B%C2%B7%E6%96%AF%E5%A5%88%E5%BE%B7&action=edit&redlink=1
            - text: 的“剧情节拍表”，以这种电影制作的工业化标准来控制剧本节奏，设计九条主线，十六个结局和各类选项，并控制每条故事线长度为现在电影1小时30分到2小时30分的长度，最后将大纲转交云卷语文书负责创作文本
            - superscript [ref=e415]:
              - link "[7]" [ref=e416] [cursor=pointer]:
                - /url: "#cite_note-gamersky01-8"
            - text: 。游戏演出方面，为了增加玩家沉浸感，制作团队给角色站位设计了近、中、远三种景别，每个角色有多个表情变化（主角有三四十种表情），不同场景都有仔细考虑角色站位和镜头运动，为此他们的内部交流文本量超过三百万字
            - superscript [ref=e417]:
              - link "[10]" [ref=e418] [cursor=pointer]:
                - /url: "#cite_note-youxiputao01-11"
            - text: 。早期制作团队因为成本问题
            - superscript [ref=e419]:
              - link "[11]" [ref=e420] [cursor=pointer]:
                - /url: "#cite_note-gameres01-12"
            - text: 和不固化角色的性格选择不使用
            - link "配音" [ref=e421] [cursor=pointer]:
              - /url: /wiki/%E9%85%8D%E9%9F%B3
            - superscript [ref=e422]:
              - link "[10]" [ref=e423] [cursor=pointer]:
                - /url: "#cite_note-youxiputao01-11"
            - text: ，后期考虑到作品定位是硬派港式剧情和作品二次元的美术风格之间可能割裂感，使用粤语配音配，可以让玩家代入到硬派港式剧本中。同时市面上也几乎没有粤语为主的游戏佳作，配音组和HJL_Misaki也希望借《海沙风云》尝试改变这个局面
            - superscript [ref=e424]:
              - link "[7]" [ref=e425] [cursor=pointer]:
                - /url: "#cite_note-gamersky01-8"
            - text: 。RCVO粤语配音组和圆动力粤配联盟在三个月时间，组织三十一名
            - link "配音员" [ref=e426] [cursor=pointer]:
              - /url: /wiki/%E9%85%8D%E9%9F%B3%E5%93%A1
            - text: 完成作品的配音工作，其中还分出一批人将剧本改成粤语剧本
            - superscript [ref=e427]:
              - link "[16]" [ref=e428] [cursor=pointer]:
                - /url: "#cite_note-weibo03-17"
            - text: 。配音组在工期紧张的情况下产出了两万六千多个音频，而且绝大部分的音频都无需修改，创作团队只需对文本进行微调即可
            - superscript [ref=e429]:
              - link "[7]" [ref=e430] [cursor=pointer]:
                - /url: "#cite_note-gamersky01-8"
            - text: 。
          - paragraph [ref=e431]:
            - text: 2020年10月中旬HJL_Misaki正式召集成员在
            - link "成都" [ref=e432] [cursor=pointer]:
              - /url: /wiki/%E6%88%90%E9%83%BD
            - text: 集合，以加快游戏的开发
            - superscript [ref=e433]:
              - link "[12]" [ref=e434] [cursor=pointer]:
                - /url: "#cite_note-gameres02-13"
            - text: ，这个时期游戏的完成度已经接近90%
            - superscript [ref=e435]:
              - link "[10]" [ref=e436] [cursor=pointer]:
                - /url: "#cite_note-youxiputao01-11"
            - text: 。制作团队也很重视游戏完整性，他们为了玩家有更好的游戏体验，不断优化和打磨游戏内容，如为了更好地管理音频资料，确保游戏的整体呈现，团队整理了一套基于整个游戏涉及向度、音量、压缩模式等等的音频管理标准
            - superscript [ref=e437]:
              - link "[7]" [ref=e438] [cursor=pointer]:
                - /url: "#cite_note-gamersky01-8"
            - text: 。制作团队原计划在游戏中内置三个小游戏，由于工期所限最后作废
            - superscript [ref=e439]:
              - link "[17]" [ref=e440] [cursor=pointer]:
                - /url: "#cite_note-ali2130-1-18"
            - text: 。
