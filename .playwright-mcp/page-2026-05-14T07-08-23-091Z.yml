                    - img [ref=e146]
                  - generic [ref=e148]: 国立大学理学院物理系本科毕业生，以全系第一名身份毕业。即将前往北美攻读空间物理学硕士。父母常年国外出差，很少干预他的生活。家境宽裕。不过花钱方面一直存在着一些问题。曾经为了解决Matlab运算的速度问题特地花了两年特等奖学金的钱配置了一台性能超强的电脑，然后将其大多数使用时间用在了玩枪车球的游戏上面。
                - generic [ref=e149]: CV：无
              - generic [ref=e150]:
