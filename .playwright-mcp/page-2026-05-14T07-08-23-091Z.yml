                  - generic [ref=e162]: 国立大学生命科学学院生物系毕业生，也是生物系出名的冰霜女神，被学院推荐至欧洲著名学府攻读神经生物学硕士。平日里是图书馆的常客，亦是老师眼中的优秀学生，乖乖女的典范。唯独有瑕疵的是，乖乖女形象由于两年前不知为何突然申请搬出宿舍独自居住这件事，在之后被小道八卦冲淡了不少。日常生活中比较节俭，主要收入是奖学金。
