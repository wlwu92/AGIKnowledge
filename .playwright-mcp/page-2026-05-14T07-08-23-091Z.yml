              - paragraph [ref=e124]:
                - text: 《旧手表》（英文：Old Watch）是
                - link "灰烬天国" [ref=e125] [cursor=pointer]:
                  - /url: /index.php?title=%E7%81%B0%E7%83%AC%E5%A4%A9%E5%9B%BD&action=edit&redlink=1
                - text: 于2017年发布的
                - link "视觉小说" [ref=e126] [cursor=pointer]:
                  - /url: /%E8%A7%86%E8%A7%89%E5%B0%8F%E8%AF%B4
                - text: 。该作品在2017年初在摩点进行众筹，2017年12月21日在
                - link "Steam" [ref=e127] [cursor=pointer]:
                  - /url: /Steam
                - text: 上发布，是灰烬天国第二个游戏作品。作品有发行少量实体版，大多为众筹相关的
                - link "特典" [ref=e128] [cursor=pointer]:
                  - /url: /%E7%89%B9%E5%85%B8
                - text: 。2018年2月在
                - link "易次元" [ref=e129] [cursor=pointer]:
                  - /url: /index.php?title=%E6%98%93%E6%AC%A1%E5%85%83&action=edit&redlink=1
                - text: 上发布，名字为《指针回溯》，该版本开头免费，后续章节需要付费。
              - paragraph [ref=e130]: 游戏结尾显示「Project I 前传-旧手表」，表示作品会有后续创作。
              - heading "简介" [level=2] [ref=e132]: 简介
              - paragraph [ref=e133]: 某天在家整理衣物的邰林突然接到了一个陌生女性电话，告诉他在上周捡到的手表是一个能穿越回过去的工具。兴奋的他于是毅然放弃了自己正在打包的旅行箱，背好了彩票特等奖号码，回到了过去。但是他没想到等着他的并不是巨额奖金，而是一场终身难忘奇妙的冒险…
              - heading "主要角色" [level=2] [ref=e135]: 主要角色
              - generic [ref=e136]:
                - link "邰林" [ref=e139] [cursor=pointer]:
